I Tech/AI", "emoji": "💻", "count": 62}, {"name": "美食 Food", "emoji": "🍽️", "count": 113}, {"name": "音樂 Music", "emoji": "🎵", "count": 44}, {"name": "生活雜項 Life/Misc", "emoji": "🧘", "count": 192}, {"name": "其他 Other", "emoji": "✨", "count": 146}, {"name": "無法讀取 Unreadable", "emoji": "❓", "count": 45}];
let activeCat="ALL";let q="";
const chips=document.getElementById('chips');
const list=document.getElementById('list');
const countEl=document.getElementById('count');
function mkChip(name,emoji,n,val){const d=document.createElement('div');d.className='chip'+(val===activeCat?' active':'');d.innerHTML=(emoji?emoji+' ':'')+name+'<span class="n">'+n+'</span>';d.onclick=()=>{activeCat=val;render();};return d;}
function renderChips(){chips.innerHTML='';chips.appendChild(mkChip('全部','🗂️',DATA.length,'ALL'));CATS.forEach(c=>chips.appendChild(mkChip(c.name.split(' ')[0],c.emoji,c.count,c.name)));}
function esc(s){return (s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){
 renderChips();
 let rows=DATA.filter(d=>activeCat==='ALL'||d.category===activeCat);
 if(q){const k=q.toLowerCase();rows=rows.filter(d=>((d.author||'')+' '+(d.topic||'')+' '+(d.subcategory||'')+' '+(d.category||'')).toLowerCase().includes(k));}
 countEl.textContent=rows.length+' 則';
 list.innerHTML='';
 if(!rows.length){list.innerHTML='<div class="empty">沒有符合的內容</div>';return;}
 // group by subcategory within current view
 const groups={};rows.forEach(d=>{const g=d.subcategory||'其他';(groups[g]=groups[g]||[]).push(d);});
 const order=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);
 order.forEach(g=>{
   const h=document.createElement('div');h.className='subcat';h.textContent=(activeCat==='ALL'?'':'')+g+' · '+groups[g].length;list.appendChild(h);
   const grid=document.createElement('div');grid.className='grid';
   groups[g].forEach(d=>{
     const a=document.createElement('a');a.className='card';a.href=d.url;a.target='_blank';a.rel='noopener';
     a.innerHTML='<div class="top"><span class="auth">@'+esc(d.author||'—')+'</span><span class="date">'+esc(d.date)+'</span></div>'+
                 '<div class="topic">'+esc(d.topic)+'</div>'+
                 (activeCat==='ALL'?'<span class="tag">'+esc(d.category.split(' ')[0])+'</span>':'');
     grid.appendChild(a);
   });
   list.appendChild(grid);
 });
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
render();
</script>
